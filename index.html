<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <p class="notice">테스트 결제입니다. 실제로 돈이 빠져나가지 않습니다.</p>
    <h1>상품</h1>
    <p id="message" class="message"></p>
    <div id="products" class="product-grid"></div>
  </main>

  <script>
    async function showProducts() {
      const { data: products, error } = await db.from('products').select().order('id')
      if (error) {
        document.getElementById('message').textContent = '상품을 불러오지 못했습니다.'
        return
      }

      for (const product of products) {
        const card = document.createElement('a')
        card.className = 'product-card'
        card.href = `product.html?id=${product.id}`

        const photo = document.createElement('img')
        photo.className = 'product-photo'
        photo.src = product.image_url
        photo.alt = product.name
        photo.loading = 'lazy'

        const name = document.createElement('span')
        name.className = 'product-name'
        name.textContent = product.name
        const price = document.createElement('span')
        price.className = 'product-price'
        price.textContent = won(product.price)

        card.append(photo, name, price)
        document.getElementById('products').append(card)
      }
    }

    showProducts()
  </script>
</body>
</html>
