<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 내역</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <h1>결제 내역</h1>
  <a href="index.html">상품 목록으로</a>
  <p id="message"></p>

  <div class="table-wrap" id="table-wrap" hidden>
    <table>
      <thead>
        <tr><th>결제 시각</th><th>구매자</th><th>상품</th><th>금액</th></tr>
      </thead>
      <tbody id="orders"></tbody>
    </table>
  </div>

  <script>
    async function showOrders() {
      const message = document.getElementById('message')

      const { data: admin } = await db.from('admins').select('user_id').maybeSingle()
      if (!admin) {
        message.textContent = '관리자만 볼 수 있습니다.'
        return
      }

      const { data: orders, error } = await db.from('orders')
        .select()
        .eq('status', 'paid')
        .order('paid_at', { ascending: false })
      if (error) {
        message.textContent = '결제 내역을 불러오지 못했습니다.'
        return
      }

      document.getElementById('table-wrap').hidden = false
      for (const order of orders) {
        const row = document.createElement('tr')
        const cells = [
          new Date(order.paid_at).toLocaleString(),
          order.user_email,
          order.product_name,
          `${order.amount.toLocaleString()}원`,
        ]
        for (const text of cells) {
          const cell = document.createElement('td')
          cell.textContent = text
          row.append(cell)
        }
        document.getElementById('orders').append(row)
      }
    }

    showOrders()
  </script>
</body>
</html>
